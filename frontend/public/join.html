<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
    <!-- Primary Meta Tags -->
    <title>Imposter Game - Join</title>
    <meta name="description" content="Join an Imposter Game room." />
    <meta name="robots" content="index, follow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/join.css">
    <script> document.addEventListener('contextmenu', event => event.preventDefault()) </script>
</head>
<body>
    <div class="big-container titan-one-regular">
        ENTER JOIN CODE
    </div>
    <div class="small-container titan-one-regular">
        JOIN ROOM
        <br><br>
        <input type="text" 
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="4"
            class="join-input titan-one-regular"
            id="join-code"
            placeholder="Enter Room Code">
        <br><br>
        <button class="titan-one-regular" id="join-btn">JOIN ROOM</button>
    </div>

    <script type="module">
        import { joinOnlineGame } from './js/create_online.js';
        document.getElementById('join-btn').onclick = () => {
            const code = document.getElementById('join-code').value;
            if (code) joinOnlineGame(code);
        };
    </script>
</body>
</html>
