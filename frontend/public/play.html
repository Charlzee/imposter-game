<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Imposter Game - Play</title>
    <meta name="description" content="Play Imposter Game." />
    <meta name="robots" content="index, follow">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Unkempt:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/play.css">
    
    <script type="module" src="./js/play.js"></script>
</head>
<body>
    <div class="main-screen titan-one-regular" id="main">
        <h1 id="big-text">VIEW ROLE</h1>
        <div class="titan-one-regular" id="role-display">
            <h2 class="titan-one-regular" id="role-title">Loading...</h2>
            <h3 class="hidden" id="role-status">Loading...</h3>
            <h4 class="titan-one-regular" id="word">Loading...</h4>
            <p class="titan-one-regular" id="role-description"></p>
            <h2 class="hidden" id="role-tip">Loading...</h2>
        </div>
        <button class="titan-one-regular" id="ready-button">NEXT →</button>
        <br>
        <button class="titan-one-regular" id="back-button" onclick="lobby()">← LOBBY</button>
    </div>
</body>
</html>
