<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Imposter Game - Create Local</title>
    <meta name="description" content="Create a local Imposter Game room." />
    <meta name="robots" content="index, follow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/create.css">
    <script> document.addEventListener('contextmenu', event => event.preventDefault()) </script>

    <script type="module" src="../js/create_local.js"></script>
</head>
<body>
    <div class="big-container titan-one-regular">
        SELECT TOPIC
    </div>
    <div class="titan-one-regular" id="error-box"></div>
    <div class="topics titan-one-regular" id="topic-container"></div>

    <div class="big-container titan-one-regular">
        PLAYER COUNT
    </div>
    <div class="player-count-container titan-one-regular" id="player-count-container">
        <div class="player-add-container" id="player-add-container">
            <input type="text" class="player-name-input titan-one-regular" id="player-name-input" placeholder="Player Name" maxlength="50" value="Player">
            <button class="titan-one-regular" id="player-add-button" onclick="addPlayer()">Add Player</button>
            <button class="titan-one-regular" id="settings-button" onclick="openSettings()">SETTINGS</button>
        </div>


        <div id="settings-overlay">
            <div class="settings-content">
                <h2 class="settings-txt">GAME SETTINGS</h2>

                <div id="role-settings-container"></div>

                <p class="titan-one-regular count">Role Modifiers Enabled:</p> <input class="titan-one-regular" id="role-modifiers-enabled" type="checkbox" checked>
                <p class="titan-one-regular count">Random Events Enabled:</p> <input class="titan-one-regular" id="random-events-enabled" type="checkbox" checked>
                <button class="titan-one-regular" id="close-settings-btn">Close</button>
            </div>
        </div>

        <div class="player-container titan-one-regular" id="player-container"></div>

        <button class="start-button titan-one-regular" id="start-button" onclick="startGame()">Start</button>
    </div>
</body>
</html>
